<style>
:root {
  color-scheme: light dark;
  --bg: #fafaf7; --ink: #1d1f24; --muted: #4b505a; --line: #c9ccd3; --card: #ffffff;
  --v: #0b6e5f; --v-tint: #e3f3ef; --d: #954400; --d-tint: #fbeddc;

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a; --ink: #eceef2; --muted: #aab0bc; --line: #3a3f49; --card: #1c1f25;
    --v: #5fd0bb; --v-tint: #15302b; --d: #ffb066; --d-tint: #35271a;
    --root: #aab9f5; --root-ink: #11162b; --focus: #8fb1ff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
header, main, footer { padding: 0 16px; max-width: 1400px; margin: 0 auto; }
h1 { font-size: 1.6rem; margin: 24px 0 4px; }
h2 { font-size: 1.15rem; margin: 28px 0 8px; }
p { margin: 6px 0; }
.sub { color: var(--muted); max-width: 70ch; }
.barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 8px; }
.barra button, dialog button.fechar {
  font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line);
  border-radius: 999px; padding: 6px 14px; min-height: 36px; cursor: pointer;
}
.barra button[aria-pressed='true'] { background: var(--root); color: var(--root-ink); border-color: var(--root); }
.barra .sep { flex: 1; }
.ondas { color: var(--muted); font-size: .9rem; margin: 4px 0 12px; padding-left: 1.2em; }
.rolagem { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }

.tema.v { background: var(--v-tint); border-color: var(--v); } .tema.d { background: var(--d-tint); border-color: var(--d); }

.cabecalho small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
#lista { display: none; }
#lista details { border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; background: var(--card); }
#lista summary { padding: 10px 12px; cursor: pointer; }
#lista details details { margin: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; }

#lista h2.v { color: var(--v); } #lista h2.d { color: var(--d); }
.pilula { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: .75rem; font-weight: 700; background: var(--ink); color: var(--bg); margin-left: 6px; }

dl.corpo dt { font-weight: 650; font-size: .85rem; color: var(--muted); margin-top: 8px; }
dl.corpo dd { margin: 2px 0 0; }
.aviso { border-left: 4px solid var(--d); padding: 4px 10px; background: var(--d-tint); border-radius: 0 8px 8px 0; }
dialog.detalhe { position: fixed; inset: auto 16px 16px auto; margin: 0; width: min(560px, calc(100vw - 32px)); max-height: 70vh; overflow: auto;

dialog.detalhe .fechar { position: absolute; top: 8px; right: 8px; padding: 2px 10px; }
.tabelinha { columns: 2 320px; padding-left: 1.2em; }
footer { padding-bottom: 48px; }
footer li { margin: 2px 0; }
a { color: var(--focus); }
.linkbtn { font: inherit; color: var(--focus); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; text-align: left; }
#comecar { max-width: 90ch; }
.barra + .barra { margin-top: 0; }
.ok { flex: none; font-size: .8rem; font-weight: 700; color: var(--v); }
.enc { flex: none; font-size: .6rem; letter-spacing: 1px; color: var(--muted); }
.barra .rot { color: var(--muted); font-size: .9rem; margin-left: 8px; }
.pf { border-left: 4px solid var(--root); padding: 2px 10px 6px; background: var(--bg); border-radius: 0 8px 8px 0; margin-top: 10px; }
.pf dt:first-child { margin-top: 4px; }
.sinais li { margin: 4px 0; }
@media (prefers-reduced-motion: no-preference) { .folha, .tema { transition: background .15s; } }
</style>

<header>
  <h1>Mapa de concorrentes</h1>
  <p class="sub">O que apps consolidados fazem bem (à direita) e onde eles tropeçam (à esquerda), já sem o que o MeUsMe tem. Cada folha é um item do roadmap. Clique ou aperte Enter para ver o porquê e o que ele ganha ou custa para você.</p>
  <div class="barra" role="group" aria-label="Escolher a leitura">
    <button type="button" data-lente="perfil" aria-pressed="true">Pelo seu perfil</button>
    <button type="button" data-lente="pesquisa" aria-pressed="false">Pela pesquisa</button>

  <div class="barra" role="group" aria-label="Filtrar por encaixe no seu perfil">

    <button type="button" data-enc="medio" aria-pressed="false">Médio</button>
    <button type="button" data-enc="baixo" aria-pressed="false">Baixo</button>
  </div>
  <div class="barra" role="group" aria-label="Filtrar por onda">
    <button type="button" data-onda="0" aria-pressed="true">Todas as ondas</button>
    <button type="button" data-onda="1" aria-pressed="false">Onda 1</button>
    <button type="button" data-onda="2" aria-pressed="false">Onda 2</button>
    <button type="button" data-onda="3" aria-pressed="false">Onda 3</button>
    <span class="sep"></span>
    <button type="button" id="alterna" aria-pressed="false">Ver como lista</button>
    <button type="button" id="recolhe">Recolher temas</button>
  </div>
  <ul class="ondas" id="legenda"></ul>
  <p id="comecar"></p>
</header>
<main>
  <div class="rolagem" id="rolagem" tabindex="0" role="region" aria-label="Mapa mental, role para os lados se precisar">

</main>

ete por lugar (chegou em casa)","Áreas acima dos projetos (Casa, Trabalho, Estudos)","Seções dentro do projeto","Captura por e-mail encaminhado (exige servidor)","API e webhooks (Zapier, Make)","Visão em quadro (Kanban), só dentro de um projeto","Atributo \"me dá preguiça\" para ajudar a escolher","Patrimônio líquido e investimentos","Multimoeda e modo viagem","Orçamento por envelope (YNAB)","Ler boleto pelo código de barras (não achei concorrente que leia; vale conferir se faz sentido)","Retrospectiva do mês e do ano em linguagem simples","Sons de foco junto do relógio","iPhone (já está na fase 8 do roadmap)"],"comecar":[["D03","Regra de design, custa nada: vale antes de qualquer plano automático."],["V18","Pequeno, e aparece em todo dia de uso."],["D23","Um lembrete que falha derruba a confiança no app inteiro."],["V03","Tira atrito da captura: qualquer texto vira Caixa em dois toques."],["V08","A maior lacuna entre os apps de tarefas: passo que volta sozinho."],["V20","Ataca o \"não sei por onde começar\" e reaproveita o motor local."]],"sinais":{"U1":["Escolher o que fazer parece aleatório; priorizar e estimar prazos é o maior desafio.","Code 5/10 · chat de agenda 8/9","O app decidir e explicar a escolha; estimativa como palpite, nunca como cobrança."],"U2":["Perde a energia perto do fim: no ponto decisivo restam ideias vagas, nada concreto.","Code 5/10","Transformar o vago num próximo passo físico e proteger a reta final."],"U3":["Rende em horários sem padrão (\"varia bastante\").","chat de agenda 8/9","Não presumir manhã ou tarde; ler a energia do momento."],"U4":["Não tem método próprio e pede sugestões prontas; testa e pede outra saída quando uma não serve.","chat de agenda 8/9","Propor, mostrar o motivo, deixar recusar."],"U5":["Digitar cansa: \"muita escrita para criar as tarefas\", \"digitar R$ é lento, principalmente em celulares com teclado virtual\". Já ditou um pedido por áudio (chat de agosto).","Code 27/10 e 28/10 · claude.ai ago.","Captura com o mínimo de toques: voz, compartilhar, widget, atalhos."],"U6":["Testou Notion, ClickUp, Super Productivity e as suítes do Google e da Microsoft, e \"nada funcionou\".","Code 5/10","Nada que exija manter um sistema: poucas telas, poucos campos obrigatórios."],"U7":["Captura de gastos pelas notificações do banco: \"o problema com as notificações é a inconsistência\" (banco que não avisa, gasto que não aparece, lido errado, duplicado, tudo na Caixa).","Code 28/10","Mostrar o que funcionou e o que falhou na captura, e ter um caminho que não dependa da notificação."],"U8":["A agenda real é compartilhada com colegas; quer ver só o dia de hoje, na agenda de verdade, e que compromisso vença tarefa solta.","chat de agenda 8/9 · Code 6/10","Ler a agenda que você usa, inclusive a da equipe."],"U9":["Quer saber quanto tempo gastou em cada coisa.","Code 6/10","Tempo real por passo e por projeto, comparado com o palpite."],"U10":["Dinheiro em cinco bancos e carteiras (Mercado Pago, PicPay, Next, Inter, Nubank) e registro automático.","Code 6/10 e 28/10","Captura que funcione sem infraestrutura empresarial."],"U11":["No produto final quer tudo \"o mais simplificado possível\"; achou a sincronização via Supabase pouco intuitiva para quem usa.","Code 6/10","Zero configuração para quem usa."],"D1":["Desenvolvedor autônomo, sem CNPJ nem conta de loja: quer algo substancial sem infraestrutura gigante.","Code 28/10","Dados no aparelho; servidor só onde já existe."],"D2":["Precisa entender cada canto do código: amplo em bancos locais e lógica, com C++ sem bibliotecas e Python básico, sem aprofundar em outras linguagens.","Code 6/10","Poucas dependências, regras que dê para explicar em voz alta, ordem que siga as trilhas de estudo."],"D3":["Quer publicar na Play Store e na Microsoft Store sem o rótulo de \"perigoso\".","Code 27/10","Permissões sensíveis explicadas e com plano B."],"D4":["Confere pelo teste: pede teste no emulador, tira dúvida com um teste, compara os totais de duas versões da mesma consulta, levanta casos de borda (meia-noite contra 23:59:59, item de peso muito baixo) e corrige a hipótese em uma frase.","Code 28/10 · chat de trabalho 2/10","Cada item com linha de chegada medível e um teste."],"D5":["Quer tudo em um lugar (tarefas, tempo, diário, agenda, finanças, desktop), mas já se perdeu em ferramentas pesadas.","Code 5/10","Módulos que podem ser desligados."],"D6":["Conversa com o Claude em horário de trabalho (93% das 506 mensagens dos chats entre 6h e 18h, 99% em dia útil) e constrói o MeUsMe à noite (77% das 61 mensagens do Code depois das 18h). Isso mostra quando você escreve, não quando rende (U3 continua sendo o que você disse).","claude.ai (fev a out) · Code","Tarefas pequenas, que caibam numa noite; o que for de uso diário precisa servir no expediente, onde a agenda da equipe manda."],"D7":["Pensa de forma declarativa: em fevereiro escolheu \"o que precisa ser feito, não como fazer\" e \"resolver problemas de forma declarativa e direta\", e disse ter \"alto entendimento de lógica\" mas faltar a semântica da linguagem.","claude.ai fev. · Code 6/10","Regras configuráveis que dá para ler (como o motor e o \"ensinar o app a ler\"), em vez de código escondido."],"D8":["Constrói ferramentas para dados de produção com trava de segurança (registram \"backup obrigatório antes de reconstruir\", rodam em fases com as triggers desligadas, usam ROLLBACK e gravam uma auditoria da divergência antes da limpeza) e criou um checklist de validação com dados reais.","claude.ai jul. a out.","Backup antes de qualquer operação destrutiva e verificação com dados reais antes de liberar."],"D9":["Trabalha com SQL todo dia e depura colando código e erro: nas 506 mensagens dos chats, 21% trazem código ou log (30% dos caracteres), sobretudo SQL (Firebird em 61 mensagens, SQL Server em 8), depois Pascal e relatórios (19), PowerShell e BAT (11) e Python (8). Também manda 77 imagens e 55 arquivos de texto. O conteúdo é de ERP fiscal e financeiro (notas, SPED, comissões, estoque), e você exporta para CSV e XLSX e confere no Excel.","claude.ai (os 36 chats)","Erros copiáveis (já há \"Copiar\" em Ajustes → Sobre), aceitar imagem e arquivo na captura e uma camada de dados local que seja a parte que você mais domina."],"D10":["No trabalho usa o Claude como executor: 27 dos 36 chats geraram arquivos (cerca de 195 criados e 570 edições de trecho nas respostas), e você testa no seu ambiente e devolve o resultado ou o erro.","claude.ai (os 36 chats)","No MeUsMe, manter esse ciclo (pedir, testar, colar o erro), mas com você lendo e explicando o que entrou."]},"tensoes":[["Tudo em um lugar × me perco em ferramenta pesada","D5, U6","Módulos que se desligam e perfis prontos (D14, D13): o app cresce por trás, a tela não."],["Quero sugestões × quero controle","U4, U1","Propor, dizer o motivo e nunca mover sozinho (D03)."],["Entender cada canto do código × lançar logo","D2, D3","Ordenar pelas trilhas do guia de estudo: primeiro TypeScript e React, depois Android, depois Rust."],["Sem infraestrutura × sincronizar e compartilhar","D1","Servidor só o que já existe (Supabase, e-mail e código); compartilhar com outras pessoas fica para depois."],["Digitar menos × regras que eu consiga explicar","U5, D2","Voz, compartilhar e widget entram pelo mesmo motor de regras, que tem tutorial curto."],["Construo à noite × o app vale mais durante o expediente","D6, U8","Hipótese a conferir na fase 1: dar prioridade ao que serve no trabalho (agenda da equipe, captura rápida) e quebrar o resto em tarefas de uma noite."],["Regras declarativas que eu leio × rede que aprende sozinha","D7, D2","A rede sugere e só cria sozinha depois de medida (README); capacidade nova entra primeiro como regra legível (D26, V28)."],["Delego código no trabalho × quero entender cada canto do MeUsMe","D10, D2","Cada item entra como tarefa pequena, com teste, e você explica o que entrou antes de dar por pronto (modo \"você escreve, eu reviso\" de TAREFAS.md)."]],"lacunas":[["L1","A agenda da equipe não chega ao app","No chat de 8/9 você disse que a sua agenda é compartilhada com colegas e a pessoal estava vazia: os compromissos ficavam na agenda da equipe. O app lê só a agenda principal (`calendars/primary` em src/google.ts).","Ler as agendas que você escolher ou um .ics (D08). Confira antes se você administra a agenda da equipe: o endereço .ics secreto só aparece para quem tem essa permissão."],["L2","Organização de desktop","Estava na primeira mensagem (5/10). Hoje o app só mede o tempo por programa (Windows); não organiza nada na área de trabalho.","Decidir: entra (ex.: abrir de uma vez os programas e arquivos de um projeto) ou sai da visão do produto. Não foi pesquisado."],["L3","Diário (journaling)","Também estava na primeira mensagem. Hoje o check-in de 30 segundos guarda humor, energia e uma frase.","Decidir: manter leve (combina com U5 e U6) ou criar uma tela de diário."]],"ondasPerfil":{"1":"Agora: responde a algo que você já escreveu, com esforço pequeno ou médio e sem depender de item posterior. No máximo três itens de Android juntos.","2":"Depois: encaixe alto que depende de itens da onda 1, pede esforço grande, melhora algo que já funciona ou é ganho de longo prazo; ou encaixe médio com ganho claro.","3":"Só se o uso real pedir: sem sinal no seu uso, ou custo alto para o ganho."},"trilhas":{"2":"TypeScript","3":"HTML e CSS","4":"React","5":"Estado e dados locais","7":"Supabase","8":"Sincronização","9":"Integrações e OAuth","10":"Android","11":"Windows e Rust","12":"Qualidade e publicação"},"infras":{"aparelho":"só no aparelho","android":"Android nativo","windows":"Windows nativo","servidor":"precisa de servidor","google":"depende do Google","decisao":"decisão sua"},"esforcos":{"P":"pequeno (dias)","M":"médio (1 a 2 semanas)","G":"grande (mais de 2 semanas)"},"encaixes":{"alto":"alto","medio":"médio","baixo":"baixo"},"comecarPerfil":[["D03","Custa só disciplina e vale para tudo o que vier depois: o app propõe e você decide."],["D08","A sua agenda é compartilhada com colegas e o app só lê a principal."],["V09","Responde ao \"estimar prazos\". Entra junto com D04, para atraso não virar culpa."],["D04","Vencidos sem vermelho: o par de V09."],["D25","A captura pelas notificações do banco é inconsistente: mostra quando uma fonte de gastos parou, sem você ter de perceber sozinho."],["V03","Captura sem digitar vinda de qualquer app."],["V02","Captura em dois toques de qualquer tela do celular; faça depois de V03."],["V27","OFX como plano B que não depende de notificação nem de Open Finance."],["V20","Versão guiada do \"quebrar\": ataca o ponto de perder a energia perto do fim."],["D14","Módulos que se desligam: segura a tensão entre tudo em um lugar e se perder."],["D13","Perfis prontos na introdução, em cima de D14."]],"assistentes":[["A1","Abrir a captura por voz com \"Hey Google, abrir MeUsMe\" ✅ feito","Abrir um app por voz já funciona no Android, com o Assistant ou o Gemini.","Link interno e atalho do app \"Capturar por voz\" que abrem direto na gravação que já salva a nota.","Você já dita pedidos por áudio (U5); são dois passos, mas sem digitar nada.","Pequeno: a maior parte é TypeScript; o atalho do app é configuração nativa do Android (trilha 10).",1,["forumGemini"]],["A2","Atalho do iPhone que dita e abre o MeUsMe","O app Atalhos do iPhone dita um texto e abre um link; não precisa de código Swift.","O app entende um link com o texto ditado e grava na Caixa. Serve antes da integração completa com a Siri.","Captura por voz no iPhone sem esperar a fase 8 inteira.","Depende de haver app ou PWA instalado no iPhone; o usuário monta o atalho uma vez.",3,["cassinelli"]],["A3","Siri: \"Anotar no MeUsMe\" (App Intents)","Possível hoje para qualquer app: App Shortcuts (iOS 16 em diante) ficam na Siri, no Spotlight e no Atalhos sem configuração do usuário. No iOS 27 os App Schemas levam isso para a Apple Intelligence.","App Shortcut \"Anotar no MeUsMe\" que pergunta o texto e grava na Caixa; o resto do app continua em React (Capacitor).","Captura de uma vez só, pela voz, no iPhone.","Código Swift, Mac com Xcode e conta Apple Developer (fase 8). Não confirmei na documentação: a frase precisa ter o nome do app, há limite de cerca de 10 atalhos e a Siri pergunta o texto em seguida.",3,["wwdc24","wwdc26","appShortcuts"]],["A4","Gemini: \"anota X no MeUsMe\" (AppFunctions)","As App Actions do Assistant não passaram para o Gemini (relato de desenvolvedor). O caminho novo, AppFunctions (Android 16 em diante), roda no aparelho, mas em fevereiro de 2026 estava restrito a um pequeno grupo de desenvolvedores; o Android 17 deve ampliar. Há também a Connected Apps Platform (preview, outubro de 2026), que exige servidor MCP.","Esperar o AppFunctions abrir para todos e expor \"capturar na Caixa\" como função local. Não usar a Connected Apps Platform, que pede servidor (D1).","Captura de uma vez só pelo Gemini, sem servidor, no mesmo motor de regras.","Hoje não está disponível para o MeUsMe; reavaliar quando o Android 17 sair.",3,["appFunctions","connectedApps","forumGemini"]],["A5","Android: MeUsMe como assistente digital padrão (overlay de captura)","Um app comum pode ser escolhido como \"app de assistente digital\" nas configurações; o Perplexity faz isso e abre pelo botão liga/desliga ou pelo gesto do canto, sem abrir o app antes. A detecção de palavra de ativação de baixo consumo do sistema é só para apps do fabricante.","Implementar o serviço de assistente do Android para que o gesto abra uma janela de captura por voz por cima do app atual, gravando na Caixa.","É o mais perto de \"falar e capturar sem sair do que está fazendo\", sem microfone sempre aberto, sem servidor (D1) e sem a permissão de sobrepor apps (D3).","Código nativo (Java, trilha 10). O MeUsMe substitui o Gemini como assistente: quem usa os dois precisa escolher. Não confirmei na documentação do Android para celular os detalhes da API.",2,["perplexity","aospVoz"]],["A6","Android: \"Hey MeUsMe\" sempre ligado","Sem o detector do sistema, o app precisa manter o próprio microfone aberto num serviço em primeiro plano. Esse serviço não pode ser criado com o app em segundo plano, exige a permissão de microfone e deixa notificação fixa e indicador de microfone acesos. A Porcupine (Picovoice) teria encerrado o plano gratuito em 30/06/2026 (relato de usuários); a openWakeWord é aberta (Apache 2.0) e tem versão para Android.","Opcional e desligado por padrão: detector openWakeWord no aparelho que abre o mesmo overlay de A5.","Captura só com a voz, com o celular em qualquer tela.","Bateria, privacidade (microfone sempre aberto) e revisão mais rígida da Play. Modelos treinados com certos conjuntos de dados herdam licença não comercial: confira antes de treinar \"Hey MeUsMe\". Nomes curtos ou incomuns disparam mais por engano.",3,["fgsMicrofone","porcupineFim","openWakeWordAndroid","treinoNaoComercial"]],["A7","Windows: \"Hey MeUsMe\" abre a janela de captura","O app já fica na bandeja e já tem a janela de captura por cima de tudo (Win + Ctrl + Alt + Espaço); a palavra de ativação só a abriria. O reconhecimento de voz do navegador não é confiável dentro de WebViews: o Chromium desligou essa API no WebView do Android e o suporte no Edge é irregular.","Opcional e desligado por padrão: detector openWakeWord no lado Rust, e um motor de transcrição próprio em vez da API de voz do WebView2.","Você passa o expediente no PC (D6): capturar por voz sem trocar de janela serve no trabalho.","Rust (trilha 11), microfone aberto com o ícone do Windows aceso, e escolher e testar um motor de transcrição local. Não confirmei o comportamento da API de voz no WebView2 especificamente.",3,["webviewVoz","edgeVoz","openWakeWordAndroid"]],["A8","iPhone: sem palavra de ativação; Botão de Ação no lugar","O iOS não deixa app de terceiros ligar o microfone em segundo plano para escutar uma palavra, e as regras da App Store limitam o segundo plano a usos como áudio, VoIP e localização; também não há sob const $ = (s) => document.querySelector(s)
function h(tag, attrs, ...filhos) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue
    if (k === 'class') el.className = v
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else el.setAttribute(k, v === true ? '' : v)
  }
  for (const f of filhos.flat(Infinity)) if (f != null) el.append(f)
  return el
}
const todos = {}
for (const [l, listas] of [['v', D.vantagens], ['d', D.desvantagens]]) for (const t of listas) for (const i of t.itens) todos[i.id] = { ...i, lado: l, tema: t.nome }

const TH = 56, ROW = 46, W_RAIZ = 180, W_T = 190, W_F = 290, G0 = 56, G1 = 44, PAD = 16, TOPO = 64, ENTRE = 18

function lado(listas, s, cls, cx, nos, arestas) {
  const temas = listas.map((t) => ({ t, itens: visiveis(t) })).filter((x) => x.itens.length)
  let y = TOPO
  const caixas = []
  for (const { t, itens } of temas) {
    const key = cls + ':' + t.id
    const aberto = !estado.recolhidos.has(key)
    let yTema
    const folhas = []
    if (aberto) {
      itens.forEach((i, n) => folhas.push({ i, y: y + n * ROW }))
      yTema = (folhas[0].y + folhas[folhas.length - 1].y) / 2
      y += itens.length * ROW
    } else {
      yTema = y
      y += ROW
    }
    y += ENTRE
    caixas.push({ t, itens, key, aberto, yTema, folhas })
  }
  const altura = y - ENTRE
  return { caixas, altura, montar: (desloc, raizY) => {
    const bordaRaiz = cx + s * (W_RAIZ / 2)
    for (const c of caixas) {
      const ty = c.yTema + desloc + (ROW - 6) / 2 - TH / 2
      const tx = s > 0 ? cx + W_RAIZ / 2 + G0 : cx - W_RAIZ / 2 - G0 - W_T
      nos.push({ tipo: 'tema', cls, x: tx, y: ty, w: W_T, c })
      arestas.push({ cls, x1: bordaRaiz, y1: raizY, x2: s > 0 ? tx : tx + W_T, y2: ty + TH / 2 })
      for (const f of c.folhas) {
        const fx = s > 0 ? tx + W_T + G1 : tx - G1 - W_F
        const fy = f.y + desloc
        nos.push({ tipo: 'folha', cls, x: fx, y: fy, w: W_F, i: f.i })
        arestas.push({ cls, x1: s > 0 ? tx + W_T : tx, y1: ty + TH / 2, x2: s > 0 ? fx : fx + W_F, y2: fy + (ROW - 6) / 2 })
      }
    }
  } }
}

function mapa() {
  const larg = PAD * 2 + W_RAIZ + 2 * (G0 + W_T + G1 + W_F)
  const cx = larg / 2
  const nos = [], arestas = []
  const E = lado(D.desvantagens, -1, 'd', cx, nos, arestas)
  const V = lado(D.vantagens, +1, 'v', cx, nos, arestas)
  const altura = Math.max(E.altura, V.altura, 120)
  const raizY = TOPO + (altura - TOPO) / 2
  E.montar((altura - E.altura) / 2, raizY)
  V.montar((altura - V.altura) / 2, raizY)
  const tela = $('#tela')
  tela.style.width = larg + 'px'
  tela.style.height = altura + PAD + 'px'
  const ns = 'http://www.w3.org/2000/svg'
  const svg = document.createElementNS(ns, 'svg')
  svg.setAttribute('width', larg); svg.setAttribute('height', altura + PAD); svg.setAttribute('aria-hidden', 'true')
  for (const a of arestas) {
    const p = document.createElementNS(ns, 'path')
    const xm = (a.x1 + a.x2) / 2
    p.setAttribute('d', `M${a.x1} ${a.y1} C${xm} ${a.y1} ${xm} ${a.y2} ${a.x2} ${a.y2}`)
    p.setAttribute('class', a.cls)
    svg.append(p)
  }
  const els = [svg,
    h('div', { class: 'cabecalho d', style: `left:${PAD}px` }, 'Onde eles tropeçam', h('small', {}, `${contar(D.desvantagens)} itens`)),
    h('div', { class: 'cabecalho v', style: `right:${PAD}px;text-align:right` }, 'O que eles fazem bem', h('small', {}, `${contar(D.vantagens)} itens`)),
    h('div', { class: 'no raiz', style: `left:${cx - W_RAIZ / 2}px;top:${raizY - 34}px;width:${W_RAIZ}px;height:68px` }, 'MeUsMe', h('small', {}, 'o que falta'))]
  for (const n of nos) {
    if (n.tipo === 'tema') {
      const { c } = n
      els.push(h('button', { type: 'button', class: `no tema ${n.cls}`, style: `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${TH}px`,
        'aria-expanded': String(c.aberto), 'data-chave': c.key,
        onclick: () => { c.aberto ? estado.recolhidos.add(c.key) : estado.recolhidos.delete(c.key); desenhar(c.key) } },
        h('span', { class: 'seta', 'aria-hidden': 'true' }, c.aberto ? '▾' : '▸'), `${c.t.nome} · ${c.itens.length}`))
    } else {
      const el = h('button', { type: 'button', class: `no folha ${n.cls}`, style: `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${ROW - 6}px`, 'data-id': n.i.id,
        'aria-label': `${n.i.id}, ${n.i.titulo}, onda ${ondaDe(n.i)}${estado.lente === 'perfil' ? ', encaixe ' + D.encaixes[n.i.perfil.encaixe] : ''}${n.i.feito ? ', já feito' : ''}` },
        h('span', { class: 'cod', 'aria-hidden': 'true' }, n.i.id), h('span', { class: 'tit', 'aria-hidden': 'true' }, n.i.titulo), n.i.feito ? h('span', { class: 'ok', 'aria-hidden': 'true' }, '✅') : null, estado.lente === 'perfil' ? h('span', { class: 'enc', 'aria-hidden': 'true' }, PONTOS[n.i.perfil.encaixe]) : null, h('span', { class: 'onda', 'aria-hidden': 'true' }, String(ondaDe(n.i))))
      el.addEventListener('click', () => abrir(n.i.id, el))
      els.push(el)
    }
  }
  tela.replaceChildren(...els)
}

function lista() {

}

function desenhar(foco) {
  const mostrarMapa = estado.modo === 'mapa'
  $('#rolagem').hidden = !mostrarMapa
  $('#lista').style.display = mostrarMapa ? 'none' : 'block'
  const bt = $('#alterna')
  bt.textContent = mostrarMapa ? 'Ver como lista' : 'Ver como mapa'
  bt.setAttribute('aria-pressed', String(!mostrarMapa))
  $('#recolhe').hidden = !mostrarMapa
  document.querySelectorAll('[data-onda]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.onda === estado.onda)))
  document.querySelectorAll('[data-lente]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lente === estado.lente)))
  document.querySelectorAll('[data-enc]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.enc === String(estado.enc))))
  legenda()
  comecar()
  if (mostrarMapa) mapa(); else lista()
  if (foco) document.querySelector(`[data-chave="${foco}"]`)?.focus()
}

function legenda() {
  $('#legenda').replaceChildren(...Object.entries(estado.lente === 'perfil' ? D.ondasPerfil : D.ondas).map(([n, t]) => h('li', {}, h('b', {}, `Onda ${n}: `), t)),
    h('li', {}, h('b', {}, '✅ feito: '), `já construído no app (${Object.values(todos).filter((i) => i.feito).length} itens).`))
}
document.querySelectorAll('[data-lente]').forEach((b) => b.addEventListener('click', () => { estado.lente = b.dataset.lente; desenhar() }))
document.querySelectorAll('[data-enc]').forEach((b) => b.addEventListener('click', () => { estado.enc = b.dataset.enc === '0' ? 0 : b.dataset.enc; desenhar() }))
document.querySelectorAll('[data-onda]').forEach((b) => b.addEventListener('click', () => { estado.onda = +b.dataset.onda; desenhar() }))
$('#alterna').addEventListener('click', () => { estado.modo = estado.modo === 'mapa' ? 'lista' : 'mapa'; desenhar() })
$('#recolhe').addEventListener('click', () => {
  const todosTemas = [...D.vantagens.map((t) => 'v:' + t.id), ...D.desvantagens.map((t) => 'd:' + t.id)]
  const tudoRecolhido = todosTemas.every((k) => estado.recolhidos.has(k))
  estado.recolhidos = tudoRecolhido ? new Set() : new Set(todosTemas)
  $('#recolhe').textContent = tudoRecolhido ? 'Recolher temas' : 'Abrir temas'
  desenhar()
})
function comecar() {
  const ordem = estado.lente === 'perfil' ? D.comecarPerfil : D.comecar
  $('#comecar').replaceChildren(h('b', {}, 'Por onde começar: '), ...ordem.flatMap(([id, porque], n) => [n ? ' · ' : '', h('button', { type: 'button', class: 'linkbtn', title: porque, onclick: (e) => abrir(id, e.currentTarget) }, id + ' ' + todos[id].titulo + (todos[id].feito ? ' ✅' : ''))]), h('span', { class: 'sub' }, ' (passe o mouse ou abra para ver o porquê)'))
}
rodape()
desenhar()
</script>
</body>
</html>
